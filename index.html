<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMSPRO — Learn Without Limits</title>

    <!-- Preconnect for speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Primary:  Plus Jakarta Sans — modern, clean, excellent for UI & headings
      Mono:     JetBrains Mono   — for any code snippets
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* Apply globally before React mounts — prevents FOUT */
      *, *::before, *::after { box-sizing: border-box; }
      html { font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; }
      body { margin: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      code, pre, kbd, samp { font-family: "JetBrains Mono", "Fira Code", monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
